#docker-compose.yml
# =====================================================
# Docker Compose для проекта: Nginx + FastAPI + Next.js
# + Postgres/PostGIS + Redis (инфраструктура, без кода)
# =====================================================

services:
  # ---------------------------------------------------
  # 1️⃣ Backend: FastAPI
  # ---------------------------------------------------
  app:
    build:                          # Строим образ из Dockerfile в папке ./app
      context: ./app
      dockerfile: Dockerfile
    # build: ./app                    # Строим образ из Dockerfile в папке ./app
    working_dir: /app
    volumes:
      - ./app:/app                # Монтируем локальный код внутрь контейнера
    #command: uvicorn main:app --host 0.0.0.0 --port 8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
                                     # Старт FastAPI (dev-режим)
    environment:
      PYTHONPATH: /

      REDIS_HOST: redis
      REDIS_PORT: 6379

    healthcheck:                    # Проверка здоровья сервиса
      test:
        [
          "CMD-SHELL",
          # Делает HTTP-запрос к эндпоинту /api/health, ожидаем "ok"
          "python3 -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/health').read().decode())\" | grep -q 'ok'"
        ]
      interval: 10s                 # Проверка каждые 10 секунд
      timeout: 3s                   # Таймаут одного запроса
      retries: 10                   # После 10 неудач → unhealthy
    restart: unless-stopped         # Автоматический рестарт при падении

  # ---------------------------------------------------
  # 2️⃣ Frontend: Next.js
  # ---------------------------------------------------
  web:
    image: node:20-bookworm-slim
    working_dir: /web               # Рабочая директория в контейнере
    volumes:
      - ./web:/web                  # Монтируем локальный код фронта
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
                                     # Сначала ставим зависимости, потом запускаем dev сервер
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Проверка что Next.js слушает порт 3000, любой код <500 считается успехом
          "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------
  # 3️⃣ Reverse proxy: Nginx
  # ---------------------------------------------------
  nginx:
    image: nginx:stable
    ports:
      - "80:80"                     # Проброс порта 80 контейнера на хост
    volumes:
      - ./nginx:/etc/nginx/conf.d   # Монтируем локальный конфиг nginx
    depends_on:
      app:
        condition: service_healthy  # Nginx стартует только после healthy backend
      web:
        condition: service_healthy  # И после healthy frontend
    restart: unless-stopped
  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - analytics_data:/var/lib/postgresql/data
      - ./db/analytics:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    restart: unless-stopped

  # ---------------------------------------------------
  # 5️⃣ Redis (будущий broker / backend для Celery)
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
                                     # Лёгкий Redis, без конфигов
    ports:
      - "6379:6379"                  # Проброс для отладки
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------
  # 6️⃣ Analytics Worker (event processing)
  # ---------------------------------------------------
  analytics-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./app:/app
    command: python -m app.workers.analytics_worker
    environment:
      PYTHONPATH: /

      # --- Analytics DB ---
      ANALYTICS_POSTGRES_HOST: analytics-db
      ANALYTICS_POSTGRES_PORT: 5432
      ANALYTICS_POSTGRES_DB: analytics
      ANALYTICS_POSTGRES_USER: analytics
      ANALYTICS_POSTGRES_PASSWORD: analytics

      # --- Worker config ---
      ANALYTICS_WORKER_BATCH_SIZE: 100
      ANALYTICS_WORKER_SLEEP_SECONDS: 5

    depends_on:
      analytics-db:
        condition: service_started

    restart: unless-stopped

  # ---------------------------------------------------
  # 7️⃣ MS SQL Extractor
  # ---------------------------------------------------
  mssql-extractor:
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./app:/app
    command: python -u -m app.workers.mssql_extractor.main
    environment:
      PYTHONPATH: /

      # --- MSSQL ---
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT}
      MSSQL_DB: ${MSSQL_DB}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_DRIVER: ${MSSQL_DRIVER}

      # --- API ---
      INGEST_API_URL: ${INGEST_API_URL}

      # --- MSSQL extractor config ---
      # сколько событий читаем за один запрос из MS SQL
      # влияет на скорость ingestion и нагрузку на источник
      # сколько забираем из MSSQL за раз (batch size)
      SQL_BATCH_SIZE: 1000
      
      # на сколько событий делим batch при отправке в API 
      # меньше = стабильнее, больше = быстрее 
      MSSQL_CHUNK_SIZE: 100
      
      # сколько секунд ждать, если новых событий нет в MS SQL
      # уменьшать = быстрее реакция, но больше нагрузка на источник 
      # пауза если пусто 
      MSSQL_SLEEP_SECONDS: 20
      
      # сколько раз повторять отправку при ошибке (retry)
      # защищает от временных сбоев сети или API
      MSSQL_MAX_RETRIES: 3
      
      # пауза между retry (в секундах)
      # увеличивать, если API не успевает
      MSSQL_RETRY_DELAY: 10
      
      # таймаут HTTP-запроса к ingest API (в секундах)
      # защищает от зависания при недоступном сервисе
      MSSQL_HTTP_TIMEOUT: 30

    depends_on:
      app:
        condition: service_healthy

    restart: no # unless-stopped

# ---------------------------------------------------
# Volumes (persistency)
# ---------------------------------------------------
volumes:
  analytics_data: