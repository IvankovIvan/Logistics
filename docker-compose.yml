#docker-compose.yml
# =====================================================
# Docker Compose для проекта: Nginx + FastAPI + Next.js
# + Postgres/PostGIS + Redis (инфраструктура, без кода)
# =====================================================

services:
  # ---------------------------------------------------
  # 1️⃣ Backend: FastAPI
  # ---------------------------------------------------
  app:
    build:                          # Строим образ из Dockerfile в папке ./app
      context: ./app
      dockerfile: Dockerfile
    # build: ./app                    # Строим образ из Dockerfile в папке ./app
    working_dir: /app
    volumes:
      - ./app:/app                # Монтируем локальный код внутрь контейнера
    #command: uvicorn main:app --host 0.0.0.0 --port 8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
                                     # Старт FastAPI (dev-режим)
    environment:
      PYTHONPATH: /
      # ------------------------------------------------
      # Переменные БД и Redis
      # ⚠️ Пока НЕ используются кодом
      # Добавлены заранее под Project №1.1
      # ------------------------------------------------
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics

      REDIS_HOST: redis
      REDIS_PORT: 6379

      DATA_SOURCE_MODE: postgres # ${DATA_SOURCE_MODE:-fake} #ingest-источником

    healthcheck:                    # Проверка здоровья сервиса
      test:
        [
          "CMD-SHELL",
          # Делает HTTP-запрос к эндпоинту /api/health, ожидаем "ok"
          "python3 -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/health').read().decode())\" | grep -q 'ok'"
        ]
      interval: 10s                 # Проверка каждые 10 секунд
      timeout: 3s                   # Таймаут одного запроса
      retries: 10                   # После 10 неудач → unhealthy
    restart: unless-stopped         # Автоматический рестарт при падении

  # ---------------------------------------------------
  # 2️⃣ Frontend: Next.js
  # ---------------------------------------------------
  web:
    image: node:20-bookworm-slim
    working_dir: /web               # Рабочая директория в контейнере
    volumes:
      - ./web:/web                  # Монтируем локальный код фронта
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
                                     # Сначала ставим зависимости, потом запускаем dev сервер
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Проверка что Next.js слушает порт 3000, любой код <500 считается успехом
          "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------
  # 3️⃣ Reverse proxy: Nginx
  # ---------------------------------------------------
  nginx:
    image: nginx:stable
    ports:
      - "80:80"                     # Проброс порта 80 контейнера на хост
    volumes:
      - ./nginx:/etc/nginx/conf.d   # Монтируем локальный конфиг nginx
    depends_on:
      app:
        condition: service_healthy  # Nginx стартует только после healthy backend
      web:
        condition: service_healthy  # И после healthy frontend
    restart: unless-stopped

  # ---------------------------------------------------
  # 4️⃣ Database: PostgreSQL + PostGIS
  # ---------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
                                     # PostgreSQL 16 + PostGIS
                                     # Будет использоваться как current-state DB
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
                                     # Persist данные БД между перезапусками
    ports:
      - "5432:5432"                  # Проброс порта для локального подключения (psql, IDE)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U logistics -d logistics"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------
  # 5️⃣ Redis (будущий broker / backend для Celery)
  # ---------------------------------------------------
  analytics-db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - analytics_data:/var/lib/postgresql/data
      - ./db/analytics:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    restart: unless-stopped

  # ---------------------------------------------------
  # 5️⃣ Redis (будущий broker / backend для Celery)
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
                                     # Лёгкий Redis, без конфигов
    ports:
      - "6379:6379"                  # Проброс для отладки
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ---------------------------------------------------
# Volumes (persistency)
# ---------------------------------------------------
volumes:
  postgres_data:
    # Хранилище данных PostgreSQL
    # Удаляется только вручную (docker volume rm)
  analytics_data: