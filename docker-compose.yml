# docker-compose.yml
# =====================================================
# Этот файл поднимает:
# 1) Backend (FastAPI на uvicorn)
# 2) Frontend (Next.js в dev-режиме)
# 3) nginx для проксирования фронта и бэка
# =====================================================

services:

  # -------------------------------------
  # 1) Backend: FastAPI
  # -------------------------------------
  app:
    build: ./app                 # Собираем образ из Dockerfile в ./app
    volumes:
      - ./app:/app               # Монтируем код в контейнер (удобно для dev)
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # Healthcheck проверяет, что FastAPI реально отвечает на /api/health
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8000/api/health | grep -q 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped       # Перезапуск при падении

  # -------------------------------------
  # 2) Frontend: Next.js (dev-режим)
  # -------------------------------------
  web:
    image: node:20-bookworm-slim
    working_dir: /web
    volumes:
      - ./web:/web               # Монтируем код фронта
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}      # Прокси для скачивания npm-пакетов (опционально)
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,app,web,nginx"
    # Dev-режим:
    # 1) npm install подтягивает локальные node_modules (если есть)
    # 2) next dev с биндингом на 0.0.0.0, чтобы nginx мог проксировать
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL",
             "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
      ]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # -------------------------------------
  # 3) Reverse proxy: nginx
  # -------------------------------------
  nginx:
    image: nginx:stable
    ports:
      - "80:80"                 # Проброс порта 80 на хост
    volumes:
      - ./nginx:/etc/nginx/conf.d   # Монтируем конфиги nginx (default.conf)
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped