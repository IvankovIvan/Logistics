# =====================================================
# Docker Compose для проекта: Nginx + FastAPI + Next.js
# =====================================================

services:
  # ---------------------------------------------------
  # 1️⃣ Backend: FastAPI
  # ---------------------------------------------------
  app:
    build: ./app                    # Строим образ из Dockerfile в папке ./app
    volumes:
      - ./app:/app                  # Монтируем локальный код внутрь контейнера
    command: uvicorn main:app --host 0.0.0.0 --port 8000  # Старт FastAPI
    healthcheck:                    # Проверка здоровья сервиса
      test:
        [
          "CMD-SHELL",
          # Делает HTTP-запрос к эндпоинту /api/health, ожидаем "ok"
          "python3 -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/health').read().decode())\" | grep -q 'ok'"
        ]
      interval: 10s                 # Проверка каждые 10 секунд
      timeout: 3s                   # Таймаут одного запроса
      retries: 10                   # После 10 неудач → unhealthy
    restart: unless-stopped         # Автоматический рестарт при падении

  # ---------------------------------------------------
  # 2️⃣ Frontend: Next.js
  # ---------------------------------------------------
  web:
    image: node:20-bookworm-slim
    working_dir: /web               # Рабочая директория в контейнере
    volumes:
      - ./web:/web                  # Монтируем локальный код фронта
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
                                     # Сначала ставим зависимости, потом запускаем dev сервер
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Проверка что Next.js слушает порт 3000, любой код <500 считается успехом
          "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------
  # 3️⃣ Reverse proxy: Nginx
  # ---------------------------------------------------
  nginx:
    image: nginx:stable
    ports:
      - "80:80"                     # Проброс порта 80 контейнера на хост
    volumes:
      - ./nginx:/etc/nginx/conf.d   # Монтируем локальный конфиг nginx
    depends_on:
      app:
        condition: service_healthy  # Nginx стартует только после healthy backend
      web:
        condition: service_healthy  # И после healthy frontend
    restart: unless-stopped          # Автоматический рестарт при падении