services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
      - web
    restart: unless-stopped

  app:
    build: ./app
    volumes:
      - ./app:/app
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ./web:/web
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped